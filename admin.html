<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowSport - Intranet Avanzada</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050505; color: #fff; display: flex; justify-content: center; padding: 50px; }
        .container { width: 100%; max-width: 1100px; }
        .card { background-color: #151517; border: 1px solid #333; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #e11d2e; margin-top: 0; }
        input, select, textarea { padding: 12px; margin-bottom: 15px; background: #0f0f10; border: 1px solid #333; color: white; border-radius: 8px; width: 100%; box-sizing: border-box; font-family: inherit; }
        button { padding: 12px; background: #e11d2e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #ff3b4d; }
        .btn-green { background: #28a745; margin-top: 10px; }
        .btn-green:hover { background: #218838; }
        .btn-red { background: #dc3545; padding: 6px 12px; width: auto; font-size: 12px; }
        .btn-red:hover { background: #c82333; }
        #dashboardPanel { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #0f0f10; font-size: 14px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; vertical-align: middle; }
        th { background-color: #1a1a1c; color: #e11d2e; }
        .badge { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .attr-badge { background: #2a2a2d; color: #ccc; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-size: 11px; margin: 2px; display: inline-block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #1a1a1c; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPanel" class="card" style="max-width: 400px; margin: 0 auto;">
        <h2>🔒 Intranet ShadowSport</h2>
        <input type="email" id="email" placeholder="Correo electrónico" value="admin@shadowsport.com">
        <input type="password" id="password" placeholder="Contraseña" value="supersecreto123">
        <button onclick="iniciarSesion()">Ingresar</button>
        <p id="mensajeLogin" style="color: #ff3b4d; text-align: center; margin-top: 15px;"></p>
    </div>

    <div id="dashboardPanel" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📊 Panel de Control (Esquema Polimórfico)</h2>
            <button onclick="cerrarSesion()" style="width: auto; background: #333; padding: 8px 15px;">Cerrar Sesión</button>
        </div>
        
        <form id="formNuevoProducto" class="form-grid" onsubmit="crearProducto(event)">
            <h3 class="full-width" style="margin: 0; color: #fff;">➕ Agregar Producto</h3>
            <input type="text" id="p_name" placeholder="Nombre" required>
            <input type="number" id="p_price" placeholder="Precio ($)" required>
            <select id="p_category">
                <option value="Training">Training</option>
                <option value="Running">Running</option>
                <option value="Recovery">Recovery</option>
            </select>
            <select id="p_stock">
                <option value="in_stock">Disponible</option>
                <option value="low_stock">Poco Stock</option>
                <option value="out_of_stock">Agotado</option>
            </select>
            <input type="text" id="p_image" class="full-width" placeholder="URL de la imagen" required>
            
            <div class="full-width">
                <label style="font-size: 12px; color: #aaa; margin-bottom: 5px; display: block;">Atributos Dinámicos (JSON válido):</label>
                <textarea id="p_attributes" rows="3" placeholder='{"type": "Footwear", "sizes_mx": [26, 27], "colors": ["Negro"]}'></textarea>
            </div>
            
            <button type="submit" class="btn-green full-width">Guardar Producto</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Detalles (NoSQL)</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    async function iniciarSesion() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msj = document.getElementById('mensajeLogin');
        msj.innerText = "Conectando...";
        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const datos = await res.json();
            if (res.ok) {
                localStorage.setItem('token_shadowsport', datos.token);
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('dashboardPanel').style.display = 'block';
                cargarInventarioProtegido();
            } else { msj.innerText = "❌ " + datos.error; }
        } catch (e) { msj.innerText = "Error de conexión."; }
    }

    async function cargarInventarioProtegido() {
        const token = localStorage.getItem('token_shadowsport');
        const res = await fetch(`${API_URL}/products`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const productos = await res.json();
        const tabla = document.getElementById('tablaProductos');
        tabla.innerHTML = ''; 

        productos.reverse().forEach(prod => {
            // MAGIA NOSQL: Leemos el objeto attributes y lo convertimos en etiquetas visuales
            let atributosHTML = '';
            if (prod.attributes) {
                for (const [clave, valor] of Object.entries(prod.attributes)) {
                    // Si el valor es una lista (ej. tallas), lo unimos con comas
                    const valorFormateado = Array.isArray(valor) ? valor.join(', ') : valor;
                    atributosHTML += `<span class="attr-badge"><b>${clave}:</b> ${valorFormateado}</span>`;
                }
            } else {
                atributosHTML = '<span style="color: #666; font-size: 11px;">Sin atributos extra</span>';
            }

            tabla.innerHTML += `
                <tr>
                    <td><strong>${prod.name}</strong></td>
                    <td><span class="badge">${prod.category}</span></td>
                    <td>$${prod.price}</td>
                    <td style="max-width: 300px;">${atributosHTML}</td>
                    <td>${prod.stock_status === 'in_stock' ? '✅' : '⚠️'}</td>
                    <td><button class="btn-red" onclick="borrarProducto('${prod._id}')">🗑️</button></td>
                </tr>
            `;
        });
    }

    async function crearProducto(event) {
        event.preventDefault();
        const token = localStorage.getItem('token_shadowsport');
        
        let atributosParseados = {};
        const attrTexto = document.getElementById('p_attributes').value;
        
        // Verificamos si el usuario escribió un JSON válido
        if(attrTexto.trim() !== '') {
            try {
                atributosParseados = JSON.parse(attrTexto);
            } catch(e) {
                alert("❌ Error: El campo de Atributos debe ser un formato JSON válido.");
                return;
            }
        }

        const nuevoProducto = {
            name: document.getElementById('p_name').value,
            price: Number(document.getElementById('p_price').value),
            category: document.getElementById('p_category').value,
            stock_status: document.getElementById('p_stock').value,
            image_url: document.getElementById('p_image').value,
            attributes: atributosParseados // Aquí viaja el polimorfismo
        };

        const res = await fetch(`${API_URL}/products`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(nuevoProducto)
        });

        if(res.ok) {
            document.getElementById('formNuevoProducto').reset();
            cargarInventarioProtegido();
        } else { alert("❌ Error al guardar"); }
    }

    async function borrarProducto(id) {
        if(!confirm("¿Borrar producto?")) return;
        const token = localStorage.getItem('token_shadowsport');
        const res = await fetch(`${API_URL}/products/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }});
        if(res.ok) cargarInventarioProtegido();
    }

    function cerrarSesion() {
        localStorage.removeItem('token_shadowsport'); window.location.reload();
    }

    if(localStorage.getItem('token_shadowsport')) {
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('dashboardPanel').style.display = 'block';
        cargarInventarioProtegido();
    }
</script>
</body>
</html>
